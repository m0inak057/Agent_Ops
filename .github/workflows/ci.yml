name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install flake8 black
      - name: Run flake8
        run: flake8 backend/ agents/ evaluation/ --max-line-length=100 --exclude=__pycache__
      - name: Run black check
        run: black --check backend/ agents/ evaluation/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run evaluation tests
        run: pytest evaluation/tests/ -v --tb=short
        env:
          OPENAI_API_KEY: placeholder
          GITHUB_TOKEN: placeholder
      - name: Run backend tests
        run: pytest backend/tests/ -v --tb=short
        env:
          OPENAI_API_KEY: placeholder
          GITHUB_TOKEN: placeholder
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f infrastructure/Dockerfile.backend -t agentops-backend .
      - name: Build github_mcp image
        run: docker build -f infrastructure/Dockerfile.github_mcp -t agentops-github-mcp .
      - name: Build filesystem_mcp image
        run: docker build -f infrastructure/Dockerfile.filesystem_mcp -t agentops-filesystem-mcp .
      - name: Build test_mcp image
        run: docker build -f infrastructure/Dockerfile.test_mcp -t agentops-test-mcp .
      - name: Build devops_mcp image
        run: docker build -f infrastructure/Dockerfile.devops_mcp -t agentops-devops-mcp .

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint
      - name: Build
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
