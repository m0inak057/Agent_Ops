name: Evaluation Quality Gate

# GitHub Actions `needs` can only reference jobs within the same
# workflow file, so this gate is chained after CI via workflow_run
# instead of a cross-workflow `needs: [lint, test, docker-build]`.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run quality gate check
        run: python check_threshold.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
