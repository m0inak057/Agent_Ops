name: Evaluation Gate

on:
  pull_request:
    branches: [main]

jobs:
  run-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run evaluation framework against benchmark dataset
        run: python -m evaluation.framework

      - name: Enforce evaluation quality gate
        run: echo "Evaluation gate placeholder — fails the build below a metric threshold."
